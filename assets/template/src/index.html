<!doctype html>
<html><head><meta charset="utf-8"><title>Coded animation</title>
<style>
html,body{margin:0;height:100%;background:#07080f;overflow:hidden}
#c{display:block;width:100vw;height:100vh;object-fit:contain}
#play{position:fixed;inset:0;display:none;align-items:center;justify-content:center;cursor:pointer}
#play div{width:0;height:0;border-left:70px solid #f3e8d0;border-top:44px solid transparent;border-bottom:44px solid transparent;opacity:.9}
</style></head><body>
<!-- Edge "boil": three displacement maps cycled 8x per second by main.js. Lower `scale` for crisper edges. -->
<svg width="0" height="0" style="position:absolute">
  <filter id="rough0" x="0" y="0" width="1920" height="1080" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="rough1" x="0" y="0" width="1920" height="1080" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="rough2" x="0" y="0" width="1920" height="1080" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="23" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="play"><div></div></div>
<audio id="vo" preload="auto"></audio>
<script src="engine.js"></script>
<!-- add more scene files here (s1.js, s2.js, ...) before scenes.js if one file gets long -->
<script src="scenes.js"></script>
<script src="main.js"></script>
</body></html>
